# Compose file used by the VPS provisioning and deploy scripts — see
# docs/DEPLOYMENT.md. Host-level Caddy (see Caddyfile) reverse-proxies to
# this container on localhost:3000, so the app port is bound to loopback.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      # Overrides the DATABASE_URL from .env.production to match the
      # in-container bind-mount path below. Deliberately /app/data, not
      # /app/prisma -- the Dockerfile bakes schema.prisma/migrations/seed.ts
      # into /app/prisma, and bind-mounting straight onto that path would
      # shadow them, breaking `prisma migrate deploy` and `npm run db:seed`.
      DATABASE_URL: "file:/app/data/dev.db"
      UPLOADS_DIR: /app/uploads
    volumes:
      # Named/bind-mounted so the SQLite file persists across
      # `docker compose up --build` redeploys.
      - ./data/db:/app/data
      - ./data/backups:/app/backups
      - ./data/uploads:/app/uploads
